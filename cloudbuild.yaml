# qam-ia-chatbot: Firestore, buckets, IAM (incl. el service agent de Generative
# Language sobre el bucket, ver docs/MANUAL.md sección 5) y el trigger de Cloud
# Build (apunta a este archivo desde 2026-07-27) ya están validados contra el
# tenant real floridablanca. prem-ia-chatbot todavía no se tocó — su trigger de
# la rama master puede tener el mismo problema de builder image/service name
# que tuvo este (ver historial de fixes), revisar antes de pushear a master.

steps:
  # Build
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '.'

  # Push a Artifact Registry (gcr.io)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:${COMMIT_SHA}'

  # Deploy a Cloud Run
  # gcr.io/google-cloud-sdk/slim quedó deprecado (Google migró el path a
  # Artifact Registry) -- deploy-sa no tiene artifactregistry.downloadArtifacts
  # sobre projects/google-cloud-sdk, así que ese pull falla con 403 tras la
  # migración. gcr.io/google.com/cloudsdktool/cloud-sdk sigue siendo el path
  # público válido; es el que usan todos los demás triggers reales del
  # proyecto (validado en el build real c6f66cf4..., 2026-07-27).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--ingress=all'
      - '--no-allow-unauthenticated'
      - '--service-account=${_RUN_SA}'
      - '--set-env-vars=ENVIRONMENT=${_ENVIRONMENT},SERVICE_NAME=${_SERVICE_NAME},GOOGLE_CLOUD_PROJECT=${_PROJECT_ID},GCP_PROJECT=${_PROJECT_ID},TENANT_BUCKET=${_TENANT_BUCKET},LOG_LEVEL=${_LOG_LEVEL}'
      - '--set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest'
      - '--min-instances=${_MIN_INSTANCES}'
      - '--max-instances=${_MAX_INSTANCES}'
      - '--memory=${_MEMORY}'
      - '--cpu=${_CPU}'
      - '--concurrency=${_CONCURRENCY}'
      - '--timeout=${_TIMEOUT}'

images:
  - 'gcr.io/${_PROJECT_ID}/${_SERVICE_NAME}:${COMMIT_SHA}'

# Defaults = ambiente QA (qam-ia-chatbot). Para prem, el trigger de Cloud Build de
# la rama master debe sobreescribir estas substitutions a nivel de trigger:
#   _SERVICE_NAME=prem-ia-chatbot, _ENVIRONMENT=prem,
#   _TENANT_BUCKET=nexura-chatbot-tenants-prem
substitutions:
  _SERVICE_NAME: qam-ia-chatbot
  _REGION: us-central1
  _PROJECT_ID: pre-qa-functions
  _ENVIRONMENT: qa
  _LOG_LEVEL: INFO
  _TENANT_BUCKET: nexura-chatbot-tenants-qa
  _RUN_SA: run-sa@pre-qa-functions.iam.gserviceaccount.com
  _MIN_INSTANCES: '0'
  _MAX_INSTANCES: '3'
  _MEMORY: 512Mi
  _CPU: '1'
  _CONCURRENCY: '80'
  _TIMEOUT: '300'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
